name: Regression Resource Check

on:
  pull_request_target: # Only works when in the default branch (can work on others as long as also in default branch)
    types: 
      - opened
      - reopened 
      - labeled
      - unlabeled
      - synchronize
# Need to add push logic to call API properly! Workflow assumes a PR, but there isn't one on push to develop...

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MACHINES: "acorn derecho gaeac6 hercules orion ursa wcoss2"
  #BASE_URL: https://api.github.com/repos/ufs-community/ufs-weather-model
  BASE_URL: https://api.github.com/repos/NOAA-EPIC/ufs-weather-model
  PR_NUM: ${{ github.event.number }}
  PNG_TOKEN: ${{ secrets.PNG_TOKEN }}

jobs:
  get-data:  
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Install dependencies
        run: |
          pip install requests numpy matplotlib pandas
          mkdir -p data
      - name: Cache machine stats
        id: cache-stats
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/data
          key: hist-stats-${{ github.event.pull_request.base.sha }} # If develop gets updated, data from repo should, too
      - name: Set data env var (if cache hit) and compare w/HEAD of develop 
        if: steps.cache-stats.outputs.cache-hit == 'true'
        run: |
          echo "TEST_STATS=${{ github.workspace }}/data" >> $GITHUB_ENV
          python -m tests-dev.scripts.get_data
        env: 
          TEST_STATS: ${{ github.workspace }}/data
      - name: Get historical data and compare w/HEAD of develop
        if: steps.cache-stats.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          python -m tests-dev.scripts.get_data
      - name: Upload json files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with: 
          name: data
          path: ${{ github.workspace }}/data
  wiki-push:
    runs-on: ubuntu-latest
    needs: get-data
    if: github.event.label.name == 'update-wiki-pngs'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Install dependencies
        run: |
          pip install numpy matplotlib
      - name: Download data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with: 
          name: data
          path: data
      - name: Store data location
        run: |
          echo "PLOT_DATA=${{ github.workspace }}/data" >> $GITHUB_ENV
      - name: Create plots
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p plots
          python -m tests-dev.scripts.create_images
      - name: Clone wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: ${{ github.repository }}.wiki 
          path: wm-wiki 
          token: ${{ secrets.PNG_TOKEN }} 
      - name: Copy plots to wiki
        if: env.PR_NUM != '' # Still needed? 
        run: |
          cd wm-wiki
          if [[ ! -d "plots" ]]; then
            mkdir -p plots
          fi
          echo $PR_NUM
          cd plots
          cp $GITHUB_WORKSPACE/plots/* .
      - name: Push images to wiki
        run: |
          cd wm-wiki

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          echo "added plots to wm-wiki"
          
          status=`git status -s`

          if [ -z "${status}" ]; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-add plots to wiki"
            git push origin master
          fi
  write-results:  
    runs-on: ubuntu-latest
    needs: get-data
    permissions:
      pull-requests: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Install dependencies
        run: |
          pip install pandas mdutils numpy matplotlib
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Write results summary
        run: |
          python -m tests-dev.scripts.write_test_summary >> $GITHUB_STEP_SUMMARY
        env: 
          RUNTIME_RESULTS: ${{ github.workspace }}/data/runtime_results.json
          MEMORY_RESULTS: ${{ github.workspace }}/data/memory_results.json
  post-results:
    runs-on: ubuntu-latest
    needs: get-data
    permissions:
      pull-requests: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Install dependencies
        run: |
          pip install mdutils
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "Test Suite Performance"
          comment-author: 'github-actions[bot]'
      - name: Generate message text
        id: message_text
        run: |
          python -m tests-dev.scripts.generate_message_text
        env: 
          RUNTIME_RESULTS: ${{ github.workspace }}/data/runtime_results.json
          MEMORY_RESULTS: ${{ github.workspace }}/data/memory_results.json
          OUTPUT_FILE: ${{ github.workspace }}/pr_post.md
      - name: Post results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ github.workspace }}/pr_post.md
          edit-mode: replace
