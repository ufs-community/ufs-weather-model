name: Repo Check
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  repocheck:
    name: Repo check
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify submodule commits
        # TEMP: unmerged ufs-community/ufs-ci-tools#7 head; repin after merge
        uses: ufs-community/ufs-ci-tools/actions/verify-submodules@7e9936972564f33b950b0c480edd593ea7d59a3c
        with:
          config: .github/submodules.yaml
          target-branch: develop
