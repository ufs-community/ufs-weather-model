# This is a CI workflow for the UFS Weather model.
#
# This workflow builds UWM with Spack.
#
# Alex Richert, Sep 2023
name: Spack
on: [push,pull_request,workflow_dispatch]

jobs:
  # This job builds with Spack using every combination of variants and runs the CTest suite each time
  Spack:
    strategy:
      matrix:
        config:
        - {
            os: "ubuntu-latest",
            app: "S2SWA",
            ccpp_suites: "FV3_GFS_v17_coupled_p8,FV3_GFS_v17_coupled_p8_ugwpv1",
          }
        - {
            os: "ubuntu-latest",
            app: "ATM",
            ccpp_suites: "FV3_GFS_v16,FV3_GFS_v16_flake,FV3_GFS_v16_ras,FV3_GFS_v17_p8,FV3_GFS_v17_p8_ugwpv1",
          }
    runs-on: ${{ matrix.config.os }}
    permissions:
      actions: write # for repo-level build caching

    steps:

    - name: "Install dependencies with APT"
      shell: bash
      run: |
        sudo mv /usr/local /usr/local_mv
        sudo apt install libopenmpi-dev openmpi-bin cmake

    - name: "Build Spack package"
      uses: NOAA-EMC/ci-test-spack-package@develop
      with:
        package-name: ufs-weather-model
        package-variants: app=${{ matrix.config.app }} ccpp_suites=${{ matrix.config.ccpp_suites }} mapl gftl-shared parallelio +pnetcdf esmf ~pnetcdf
        custom-recipe: ci/package.py
        spack-compiler: gcc
        repo-cache-key-suffix: ${{ matrix.config.os }}-1
        spack-externals: openmpi gmake cmake python perl git git-lfs
        use-common-build-cache: false
        test-flag: ''
        spack-ref: develop
        repo-save-key-suffix: '-1'

  # This job validates the Spack recipe by making sure each cmake build option is represented
  recipe-check:
    runs-on: ubuntu-latest

    steps:
    
    - name: recipe-check
      uses: NOAA-EMC/ci-check-spack-recipe@develop
      with:
        recipe-file: package/spack/package.py
        cmakelists-txt: package/CMakeLists.txt
