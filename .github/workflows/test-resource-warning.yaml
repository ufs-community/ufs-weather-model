# NOTE: This workflow can only be launched manually because it does not need to run on a PR 
# unless the PR updates the resource warnings workflow. If there is any issue launching it via the 
# GitHub Actions UI, it can be launched via the GitHub CLI: 
#    gh workflow run "Tests for the Regression Resource Check" --ref <branch-name>

name: Tests for the Regression Resource Check

on: workflow_dispatch

defaults:
  run:
    shell: bash -leo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run-tests:  
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Install dependencies
        run: |
          pip install pytest requests numpy pandas mdutils matplotlib
          mkdir -p data
      - name: Run tests & publish output
        id: tests
        run: |
          cd tests-dev/scripts/tests
          pytest > ./output.txt 2>&1
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: pytest-output
          path: tests-dev/scripts/tests/output.txt
      - name: Print test summary
        if: always()
        run: |
          python ${{ github.workspace }}/tests-dev/scripts/tests/print_test_summary.py --file ${{ github.workspace }}/tests-dev/scripts/tests/output.txt >> $GITHUB_STEP_SUMMARY
