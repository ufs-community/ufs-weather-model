---
name: Super-Linter

on:
  push: null
  pull_request: null

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read
      statuses: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
      
      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0 Update? 
        env:
          LINTER_RULES_PATH: '.github/linters/'
          DEFAULT_BRANCH: origin/develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: .*(tests/fv3_conf/.*|tests/ci/.*|tests/auto/.*|tests/auto-jenkins/.*|tests/opnReqTests/.*|tests/opnReqTest|tests/atparse.bash|ci/package.py).*
          VALIDATE_BASH: true
          BASH_SEVERITY: style
          #VALIDATE_GITHUB_ACTIONS: true
          #VALIDATE_LUA: true
          #VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_YAML: true
