#GFS v17 opn
# Intel: classic ifort for Fortran.
#  WCOSS2: Intel Classic (icc + ifort)
#  Ursa, Hercules (oneAPI 2024 / spack-stack 1.9.2): IntelMixed (icx + ifort)
COMPILE | s2sw_32bit_pdlib_debug  | intel | -DAPP=S2SW -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DPDLIB=ON -DDEBUG=ON| + wcoss2 ursa hercules | fv3 |
RUN | cpld_debug_c1152_v17                                | + wcoss2 ursa hercules             | baseline |

COMPILE | s2sw_32bit_pdlib  | intel | -DAPP=S2SW -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DPDLIB=ON | + wcoss2 ursa hercules | fv3 |
RUN | cpld_control_c1152_v17                              | + wcoss2 ursa hercules             | baseline |
RUN | cpld_restart_c1152_v17                              | + wcoss2 ursa hercules             |          | cpld_control_c1152_v17
RUN | cpld_mpi_c1152_v17                                  | + wcoss2 ursa hercules             |          |

# ATM-only analogs (intel)
COMPILE | atm_32bit_v17_debug  | intel | -DAPP=ATM -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DDEBUG=ON | + ursa hercules nimbus | fv3 |
RUN | debug_c1152_v17                                     | + ursa hercules nimbus      | baseline |

COMPILE | atm_32bit_v17  | intel | -DAPP=ATM -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 | + ursa hercules nimbus | fv3 |
RUN | control_c1152_v17                                   | + ursa hercules nimbus      | baseline |
RUN | restart_c1152_v17                                   | + ursa hercules nimbus      |          | control_c1152_v17
RUN | mpi_c1152_v17                                       | + ursa hercules nimbus      |          |

# Intelllvm: oneAPI LLVM compilers, IntelLLVM (icx + ifx), on Ursa and Hercules (spack-stack 1.9.2)
