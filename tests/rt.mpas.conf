### UFS with MPAS dynamical core ###
COMPILE | atm_mpas_dyn32       | intel | -DAPP=ATMMPAS -DCCPP_SUITES=MPAS_RRFS                    |       | mpas |
RUN | control_gfs_mpas                                       | - noaacloud                                | baseline |
RUN | control_rrfs_mpas                                      | - noaacloud                                | baseline |

### UFS with MPAS dynamical core DEBUG ###
COMPILE | atm_mpas_dyn32_debug | intel | -DAPP=ATMMPAS -DCCPP_SUITES=MPAS_RRFS -DDEBUG=ON         |       | mpas |
RUN | control_rrfs_mpas_debug                                | - noaacloud                                | baseline |