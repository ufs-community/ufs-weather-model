# community.conf — UFS-WM community-oriented workflow configuration,
#                  with containerized software stack libraries or natively
#                  installed stack. The regression-test (RT) approach is 
#                  used that builds and runs predefined compile configurations
#                  and test cases
#
# The driver (community.sh) compiles and runs tests sequentially, in the
# order they appear in this file.  There is no Rocoto or ECFlow workflow
# manager involved; each compile job and each test job is submitted to the
# scheduler in turn and the driver waits for completion before continuing.
#
# Header line 1: MACHINE_ID | RT_COMPILER | CONTAINER_IMG | BIND_DIRS
#   MACHINE_ID    — platform type: container (default) or other community
#                   platform name configured by the user
#   RT_COMPILER   — compiler used in the container or platform (intel or gnu)
#   CONTAINER_IMG — (optional, for container option) absolute path to the
#                   *.sif singularity container image on the host 
#   BIND_DIRS     — (optional, for container option) comma-separated
#                   host filesystems to bind/mount to container
#
# Header line 2: TPN | SCHEDULER | ACCNR | PARTITION | QUEUE | MPI_LAUNCH
#   TPN           — MPI tasks per node on the host scheduler
#   SCHEDULER     — host job scheduler: slurm, pbs, or leave blank fornone (interactive) 
#   ACCNR         — scheduler account/project name (leave blank for none)
#   PARTITION     — SLURM partition (leave blank for PBS or none)
#   QUEUE         — SLURM QOS / PBS queue name (leave blank for none)
#   MPI_LAUNCH    — MPI launch command: mpirun or mpiexec (default: mpirun)
#                   used for PBS job cards and for no SCHEDULER (interactive runs)
#
# Header line 3: RUNDIR_ROOT 
#   RUNDIR_ROOT   — top-level runtime directory for test runs
#
# Header line 4: INPUTDATA_ROOT | INPUTDATA_ROOT_WW3 | INPUTDATA_LM4 | INPUTDATA_GFSv17opn
#   INPUTDATA_ROOT     — path to the input data directory on the host filesystem
#                        (fix files and other RT input data)
#   INPUTDATA_ROOT_WW3 — (optional) path to WW3 input data; leave blank to default to
#                        INPUTDATA_ROOT/WW3_input_data_20250807
#   INPUTDATA_LM4      — (optional) path to LM4 input data; leave blank to default to
#                        INPUTDATA_ROOT/LM4_input_data
#   INPUTDATA_GFSv17opn — (optional) path to GFSv17 operational input data
#                        (S2SWA/S2SW tests); leave blank to default to
#                        INPUTDATA_ROOT/GFSv17opn_input_data
# 
# After the header lines, list compile configurations and their tests:
#   Configuration line: compile_id | MAKE_OPT  (presence of | marks a compile block)
#   Case line:          test_case_name         (single entry — no pipe character)
#   Blank or comment lines between sections are ignored.
#
# Modulefiles and job templates to review/adapt before running:
#
# Container option (MACHINE_ID=container):
#   ./modulefiles/ufs_container.<compiler>.lua   (inside-container build/run module)
#   ./modulefiles/ufs_container.runtime.lua      (host-side runtime module)
#   ./tests/fv3_conf/compile_slurm.IN_container  (or compile_qsub.IN_container)
#   ./tests/fv3_conf/fv3_slurm.IN_container      (or fv3_qsub.IN_container)
#
# Community platform option (MACHINE_ID=<COMMUNITY>, run with -p):
#   ./modulefiles/ufs_<COMMUNITY>.<compiler>.lua (build/run module for the platform)

container | intel | /work/noaa/epic/role-epic/contrib/containers/rocky9-oneapi2024.2-ss192.sif | /work,/work2,/local
80 | slurm | epic | hercules | batch | mpirun
